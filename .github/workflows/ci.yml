name: CI

# The gate. deploy.yml will not run unless this is green on the same commit.
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue's batch branch. The ruleset requires API / Web / Extension on every entry, and a
  # check that never reports leaves the entry stuck until the queue times it out.
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # The suite is Testcontainers and boots a real Postgres 16, because the schema is Postgres —
      # partial unique indexes, citext, an append-only trigger — and a suite green against H2 would
      # prove the code works on a database we do not ship. GitHub's ubuntu runners have a Docker
      # daemon, which is exactly why this job lives here and not in a Cloud Build step. `test`, not
      # `verify`: nothing here consumes the jar, and repackaging it is time spent on nothing.
      - name: Test
        working-directory: apps/api
        run: ./mvnw -B test

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint --workspace=apps/web

      - name: Test
        run: npm run test --workspace=apps/web

      # `tsc -b && vite build`. Runs the type checker, so a type error fails CI rather than surfacing
      # later as a broken image — the Dockerfile runs this same command.
      - name: Build
        run: npm run build --workspace=apps/web

  extension:
    name: Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint --workspace=apps/extension

      # The extractors against saved HTML fixtures under jsdom — no browser, no extension runtime,
      # which is the whole reason they are pure functions over a Document.
      - name: Test
        run: npm run test --workspace=apps/extension

      # Builds the popup, the service worker AND the injected page reader, then emits the manifest.
      # All of it, deliberately: the manifest names files the separate IIFE pass produces, so a build
      # that skipped that pass would ship a manifest pointing at nothing and fail silently at runtime.
      - name: Build
        run: npm run build --workspace=apps/extension
