name: CI

# The gate. deploy.yml will not run unless this is green on the same commit.
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue's batch branch. The ruleset requires API / Web / Extension on every entry, and a
  # check that never reports leaves the entry stuck until the queue times it out.
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Flyway applies migrations in version order and refuses a pending version below the highest one
      # already applied, so a version is only safe if it is above everything main already carries. A PR
      # that was numbered correctly when it opened stops being correct the moment a higher-numbered PR
      # merges ahead of it — which is how V51 reached main after V56 had already shipped. That is caught
      # here rather than at deploy, and it runs on the merge-queue branch too, which is the only gate
      # that sees the batch in the order it will actually land. A step of the API job on purpose: the
      # ruleset already requires this check, and a separate job would report without blocking.
      - name: Migration versions are above main's
        if: github.event_name != 'push'
        run: |
          git fetch --depth=1 origin main
          # Empty for anything that is not a versioned migration, so a stray file in the directory is
          # skipped rather than compared as an integer.
          version() { basename "$1" | sed -nE 's/^V([0-9]+)__.*\.sql$/\1/p'; }
          base=0
          for f in $(git ls-tree -r --name-only FETCH_HEAD apps/api/src/main/resources/db/migration); do
            v=$(version "$f"); [ -n "$v" ] || continue
            [ "$v" -gt "$base" ] && base=$v
          done
          echo "main's highest applied-or-merged migration: V${base}"
          failed=0
          # --no-renames: renumbering a migration is a rename, and a rename carrying a bad version is
          # exactly what this checks. Without it git reports R and the new version is never looked at.
          for f in $(git diff --no-renames --diff-filter=A --name-only FETCH_HEAD HEAD -- apps/api/src/main/resources/db/migration); do
            v=$(version "$f"); [ -n "$v" ] || continue
            if [ "$v" -le "$base" ]; then
              echo "::error file=${f}::V${v} is not above main's V${base}. Renumber it above V${base} — Flyway will refuse it at deploy otherwise."
              failed=1
            fi
          done
          exit $failed

      # The next three steps hold every migration to one rule: the release before it must still run on
      # the schema it leaves, so production can always roll back one release by moving traffic alone
      # (db-ops skill, "Rolling back"). Diffed against the main fetched above; a PR adding no migration
      # skips all three.
      - name: Find the migrations this PR adds
        id: migrations
        if: github.event_name != 'push'
        run: |
          git diff --no-renames --diff-filter=A --name-only FETCH_HEAD HEAD -- \
            'apps/api/src/main/resources/db/migration/V*.sql' > "$RUNNER_TEMP/added-migrations"
          if [ -s "$RUNNER_TEMP/added-migrations" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
            # A contract migration breaks the last release on purpose, so there is no N-1 run to pass.
            if xargs grep -liE '^--[[:space:]]*lightmove:contract([[:space:]]|$)' < "$RUNNER_TEMP/added-migrations" > /dev/null; then
              echo "contract=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Locks a migration takes against live traffic: an index built without CONCURRENTLY, a constraint
      # validated under an exclusive lock. Only the files this PR adds; applied history is never edited.
      - name: Migrations are safe to run on a live database
        if: steps.migrations.outputs.any == 'true'
        run: xargs npx --yes squawk-cli@2.66.0 --config .squawk.toml < "$RUNNER_TEMP/added-migrations"

      - name: Destructive migrations are marked
        if: steps.migrations.outputs.any == 'true'
        run: xargs ops/cloudsql/check-contract-marker.sh < "$RUNNER_TEMP/added-migrations"

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # The suite is Testcontainers and boots a real Postgres 16, because the schema is Postgres —
      # partial unique indexes, citext, an append-only trigger — and a suite green against H2 would
      # prove the code works on a database we do not ship. GitHub's ubuntu runners have a Docker
      # daemon, which is exactly why this job lives here and not in a Cloud Build step. `test`, not
      # `verify`: nothing here consumes the jar, and repackaging it is time spent on nothing.
      - name: Test
        working-directory: apps/api
        run: ./mvnw -B test

      # The latest release's own code and tests, on the schema this PR builds: Flyway points at this
      # tree's migrations, Hibernate validates every entity against them, and the suite drives the native
      # SQL validation cannot see. Green means rolling back to that tag after this ships needs no
      # database work.
      - name: The last release still runs on this schema
        if: steps.migrations.outputs.any == 'true' && steps.migrations.outputs.contract != 'true'
        run: |
          git fetch --depth=1 origin 'refs/tags/v*:refs/tags/v*'
          TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -z "$TAG" ]; then
            echo "::notice::No release yet, so there is nothing to roll back to."
            exit 0
          fi
          git worktree add "$RUNNER_TEMP/last-release" "$TAG"
          cd "$RUNNER_TEMP/last-release/apps/api"
          if ! SPRING_FLYWAY_LOCATIONS="filesystem:${GITHUB_WORKSPACE}/apps/api/src/main/resources/db/migration" ./mvnw -B test; then
            echo "::error::${TAG} fails on this PR's schema, so production could not roll back to it once this ships. Make the migration additive, or mark it '-- lightmove:contract' and ship its destructive half a release after the code stops using what it removes (db-ops skill, \"Rolling back\")."
            exit 1
          fi

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint --workspace=apps/web

      - name: Test
        run: npm run test --workspace=apps/web

      # `tsc -b && vite build`. Runs the type checker, so a type error fails CI rather than surfacing
      # later as a broken image — the Dockerfile runs this same command.
      - name: Build
        run: npm run build --workspace=apps/web

  extension:
    name: Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint --workspace=apps/extension

      # The extractors against saved HTML fixtures under jsdom — no browser, no extension runtime,
      # which is the whole reason they are pure functions over a Document.
      - name: Test
        run: npm run test --workspace=apps/extension

      # Builds the popup, the service worker AND the injected page reader, then emits the manifest.
      # All of it, deliberately: the manifest names files the separate IIFE pass produces, so a build
      # that skipped that pass would ship a manifest pointing at nothing and fail silently at runtime.
      - name: Build
        run: npm run build --workspace=apps/extension
