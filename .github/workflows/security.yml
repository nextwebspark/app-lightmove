name: Security

# Report-only, and deliberately its own workflow: ci.yml is the gate deploy.yml keys off, so a scanner
# living there would turn a CVE published overnight into a blocked deploy. Findings land in
# Security → Code scanning. Flipping this to a gate later is `fail-on-vuln: true` and dropping
# `exit-code: '0'` below — nothing structural.
on:
  # The schedule matters more than the PR trigger: most new CVEs arrive on code that did not change.
  schedule:
    - cron: '0 3 * * 1'
  pull_request:
    paths:
      - package-lock.json
      - '**/package.json'
      - apps/api/pom.xml
      - Dockerfile
      - .github/workflows/security.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Manifests: package-lock.json (both npm workspaces) and pom.xml, matched against OSV/GHSA by exact
  # package coordinates — no CPE heuristics, so no NVD key and none of dependency-check's Spring
  # false positives.
  dependencies:
    name: Dependencies
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      fail-on-vuln: false

  # The shipped artifact: OS packages in the runtime base image AND the full transitive Maven
  # closure inside the fat jar. The only job that sees what actually runs in Cloud Run, which is
  # also why it is the slow one — the same three-stage build deploy.yml does.
  image:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t lightmove:scan .

      - name: Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: lightmove:scan
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
