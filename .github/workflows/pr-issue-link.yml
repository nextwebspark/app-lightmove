name: PR Issue Link

# Every PR must be mapped to an issue. GitHub has no hook that can refuse a PR at creation time, so
# the rule is enforced at the only point it can be: a check that goes red the moment a PR has no
# issue, made a merge gate by branch protection on main (Settings -> Branches -> require "Issue link").
# `edited` is in the trigger list because the fix for a red run is editing the PR body, and without it
# the check would stay red on a PR that has since been mapped.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: read

concurrency:
  group: pr-issue-link-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  issue-link:
    name: Issue link
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            // A bare `#123` is not enough: "our #1 priority" would pass. The reference has to be
            // deliberate, so it must carry a linking keyword.
            const keyword = '(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|ref(?:s|erences)?|related\\s+to|part\\s+of|issue)';
            const target = `(?:#(\\d+)|https://github\\.com/${owner}/${repo}/issues/(\\d+))`;
            const pattern = new RegExp(`${keyword}\\s*:?\\s*${target}`, 'gi');

            const body = pr.body || '';
            const referenced = new Set();
            for (const match of body.matchAll(pattern)) {
              referenced.add(Number(match[1] ?? match[2]));
            }

            const fail = (message) => core.setFailed(
              `${message}\n\n` +
              'Add a line to the PR description mapping it to an issue, e.g. "Closes #123".\n' +
              'Open an issue first if none exists yet.'
            );

            if (referenced.size === 0) {
              fail('This PR is not mapped to an issue.');
              return;
            }

            // A pull request is an issue as far as the REST API is concerned, so "Closes #<some PR>"
            // would otherwise satisfy the rule.
            const linked = [];
            for (const number of referenced) {
              try {
                const { data } = await github.rest.issues.get({ owner, repo, issue_number: number });
                if (!data.pull_request) linked.push(number);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            if (linked.length === 0) {
              fail(`No issue found for: ${[...referenced].map((n) => `#${n}`).join(', ')}.`);
              return;
            }

            core.info(`Mapped to ${linked.map((n) => `#${n}`).join(', ')}.`);
