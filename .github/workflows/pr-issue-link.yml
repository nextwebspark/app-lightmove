name: PR Issue Link

# Every PR must be mapped to an issue, and every merged issue must have someone's name on it. GitHub
# has no hook that can refuse a PR at creation time, so the first half is enforced at the only point
# it can be: a check on the PR, made a merge gate by branch protection on main (Settings -> Branches
# -> require "Issue link").
#
# An unmapped PR does not just fail. It gets an issue filed for it, linked back, and `Closes #N`
# written into its description — the mapping is the point, not the paperwork. It only fails when it
# cannot do that for the author.
#
# On merge the same linked issues are read again, and whoever merged is assigned to any of them that
# nobody owns. One workflow rather than two because finding a PR's issues is the work both halves do.
#
# `edited` is in the trigger list because editing the PR body is how an author maps a PR by hand, and
# without it the check would stay red on a PR that has since been mapped. The body edit this workflow
# makes itself does NOT loop: events raised by GITHUB_TOKEN do not start new workflow runs.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, closed]

permissions:
  contents: read
  issues: write         # files the issue when a PR arrives without one, and assigns it on merge
  pull-requests: write  # writes `Closes #N` back into the PR description

concurrency:
  group: pr-issue-link-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  issue-link:
    name: Issue link
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const AUTO_LABEL = 'auto-filed';

            // A bare `#123` is not enough: "our #1 priority" would pass. The reference has to be
            // deliberate, so it must carry a linking keyword.
            const keyword = '(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|ref(?:s|erences)?|related\\s+to|part\\s+of|issue)';
            const target = `(?:#(\\d+)|https://github\\.com/${owner}/${repo}/issues/(\\d+))`;
            const pattern = new RegExp(`${keyword}\\s*:?\\s*${target}`, 'gi');

            const body = pr.body || '';
            const referenced = new Set();
            for (const match of body.matchAll(pattern)) {
              referenced.add(Number(match[1] ?? match[2]));
            }

            // A pull request is an issue as far as the REST API is concerned, so "Closes #<some PR>"
            // would otherwise satisfy the rule.
            const linked = [];
            for (const number of referenced) {
              try {
                const { data } = await github.rest.issues.get({ owner, repo, issue_number: number });
                if (!data.pull_request) linked.push(data);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            if (context.payload.action === 'closed') {
              if (!pr.merged) return;

              const merger = pr.merged_by?.login;
              if (!merger) {
                core.info('No merging user on the payload; nothing to assign.');
                return;
              }

              for (const issue of linked.filter((candidate) => candidate.assignees.length === 0)) {
                const { data } = await github.rest.issues.addAssignees({
                  owner, repo, issue_number: issue.number, assignees: [merger],
                });
                // GitHub drops an assignee it will not accept — a bot account, or a user without
                // push access — rather than failing the call, so the result is what says it stuck.
                if (data.assignees.some((assignee) => assignee.login === merger)) {
                  core.notice(`Assigned #${issue.number} to @${merger}, who merged this PR.`);
                } else {
                  core.warning(`#${issue.number} left unassigned: @${merger} cannot be an assignee here.`);
                }
              }
              return;
            }

            if (linked.length > 0) {
              core.info(`Mapped to ${linked.map((issue) => `#${issue.number}`).join(', ')}.`);
              return;
            }

            // Survives someone deleting the `Closes #N` line again: the marker, not the PR body, is
            // what says an issue has already been filed for this PR.
            const marker = `<!-- pr-issue-link: ${pr.number} -->`;
            const filed = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, labels: AUTO_LABEL, state: 'all', per_page: 100,
            });
            let issue = filed.find((candidate) => (candidate.body || '').includes(marker));

            if (!issue) {
              try {
                // Creating an issue with an unknown label fails the whole call, so the label first.
                await github.rest.issues.getLabel({ owner, repo, name: AUTO_LABEL }).catch(async (error) => {
                  if (error.status !== 404) throw error;
                  await github.rest.issues.createLabel({
                    owner, repo, name: AUTO_LABEL, color: 'ededed',
                    description: 'Filed automatically for a pull request that arrived without an issue',
                  });
                });

                ({ data: issue } = await github.rest.issues.create({
                  owner, repo,
                  title: pr.title,
                  labels: [AUTO_LABEL],
                  body:
                    `Filed automatically for #${pr.number}, which arrived without an issue.\n\n` +
                    `Replace this with the actual reason for the work — what is wrong, or what should ` +
                    `exist — and close it by merging the PR.\n\n${marker}`,
                }));
                core.notice(`Filed #${issue.number} for this PR.`);
              } catch (error) {
                // Read-only workflow permissions and fork PRs both land here: the token cannot write,
                // so the mapping is the author's to make by hand.
                core.setFailed(
                  `This PR is not mapped to an issue, and one could not be filed for it ` +
                  `(${error.status ?? ''} ${error.message}).\n\n` +
                  'Add a line to the PR description mapping it to an issue, e.g. "Closes #123".\n' +
                  'If this is a permissions failure: Settings -> Actions -> General -> Workflow ' +
                  'permissions -> "Read and write permissions".'
                );
                return;
              }
            }

            const link = `Closes #${issue.number}`;
            const template = /^[ \t]*closes[ \t]+#[ \t]*$/im;  // the template's own unfilled line
            const updated = template.test(body) ? body.replace(template, link) : `${link}\n\n${body}`;

            try {
              await github.rest.pulls.update({ owner, repo, pull_number: pr.number, body: updated });
              core.info(`Linked this PR to #${issue.number}.`);
            } catch (error) {
              core.setFailed(
                `Filed #${issue.number} for this PR but could not write the link into its ` +
                `description (${error.status ?? ''} ${error.message}). Add "Closes #${issue.number}" by hand.`
              );
            }
