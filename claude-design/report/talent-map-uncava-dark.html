<style>
:root {

  --u-chart-4: #B07CF5; --u-chart-5: #4FC3D9; --u-chart-6: #F2626B;
  --u-seq-1: #1E2440; --u-seq-2: #2E3878; --u-seq-3: #4A56D6; --u-seq-4: #6E79F2; --u-seq-5: #A3A9FA;
  --u-grid-axis: rgba(255,255,255,.10); --u-grid-line: rgba(255,255,255,.055);

  /* ── back-compat aliases, remapped to the correct UNCAVA role per usage ──
     kept so the JSX below (which references these names throughout) doesn't

  --paper: var(--u-bg); --surface: var(--u-surface); --border: var(--u-border); --border-2: var(--u-border-strong);

.pulse-ring.rust { stroke: var(--u-offlimits); }
.pulse-ring.sage { stroke: var(--u-direct); }

.app { display: flex; min-height: 100vh; }

/* insight banner — elevation carries emphasis on dark, not a colored fill */

/* basis toggle — a segmented control's selected option is a legitimate small

  background-repeat: no-repeat; background-position: right 10px center; }

.card-note { margin-top: 14px; padding-top: 13px; border-top: 1px dashed var(--u-border-strong); font-size: 12px; color: var(--u-text-2); line-height: 1.65; font-style: italic; }

/* velocity bars */
.vel-chart { display: flex; align-items: flex-end; gap: 12px; height: 160px; margin-top: 20px; padding: 0 4px; }
.vel-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 7px; }
.vel-bar-wrap { width: 100%; height: 100%; display: flex; align-items: flex-end; }
.vel-bar { width: 100%; border-radius: 5px 5px 3px 3px; }
.vel-n { font-size: 13px; font-weight: 700; }
.vel-wk { font-size: 10px; color: var(--u-text-3); }

/* generic horizontal bar list — used by DEI (and reusable anywhere else a simple ranked list fits).

.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: flex; align-items: center; gap: 12px; }

/* nav clickable states */
.nav-item.clickable { cursor: pointer; }
.nav-item.clickable:hover { background: var(--u-raised); }
.nav-item.active.clickable:hover { background: rgba(110,121,242,.22); }

/* heatmap */
.hm { display: grid; grid-template-columns: 96px repeat(6, 1fr); gap: 5px; }
.hm-colh { font-size: 9.5px; font-weight: 700; letter-spacing: .04em; color: var(--u-text-3); text-align: center; align-self: end; padding-bottom: 4px; }
.hm-rowh { font-size: 11px; color: var(--u-text-2); display: flex; align-items: center; font-weight: 600; }
.hm-cell { border: 0; border-radius: 7px; height: 44px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; transition: transform .1s, box-shadow .1s; font-family: var(--u-font-num); }
.hm-cell:hover { transform: scale(1.05); box-shadow: 0 0 0 2px var(--u-accent) inset; }
.map-bub { transition: opacity .12s; transform-box: fill-box; transform-origin: center; }
.map-bub:hover { opacity: 0.75; }
.map-bub:hover circle { stroke-width: 1; stroke: var(--u-signal); }
.hm-cell.empty { background: repeating-linear-gradient(135deg, var(--u-surface) 0 6px, var(--u-bg) 6px 12px);
  border: 1px dashed var(--border-2); color: var(--faint); font-weight: 400; cursor: pointer; }
.hm-cell.empty:hover { box-shadow: 0 0 0 2px var(--border-2) inset; transform: none; }

/* stacked bar */
.stack { display: flex; width: 100%; height: 26px; border-radius: 5px; overflow: hidden; gap: 1.5px; }
.stack-seg { height: 100%; }
.stack-legend { display: flex; gap: 16px; margin-top: 10px; flex-wrap: wrap; }
.stack-leg { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--u-text-2); }
.stack-leg-dot { width: 9px; height: 9px; border-radius: 2px; }
.stack-leg b { color: var(--u-text); font-weight: 700; margin-left: 2px; font-family: var(--u-font-num); }

/* drawer — sized to UNCAVA's right detail panel spec (320–700, 384 default) */
.drawer-scrim { position: fixed; inset: 0; background: var(--u-scrim, rgba(4,5,7,.72)); opacity: 0; pointer-events: none;
  transition: opacity .2s; z-index: 40; }
.drawer-scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 384px; max-width: 92vw; background: var(--u-surface);
  border-left: 1px solid var(--u-border); box-shadow: var(--u-e3, -14px 0 34px rgba(0,0,0,.5)); transform: translateX(100%);

.drawer-title { font-size: 19px; font-weight: 700; margin-top: 5px; color: var(--u-text); }
.drawer-sub { font-size: 12px; color: var(--u-text-3); margin-top: 3px; }
.drawer-close { border: 1px solid var(--u-border-strong); background: var(--u-surface); border-radius: 7px; width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center; color: var(--u-text-2); cursor: pointer; flex-shrink: 0; }
.drawer-close:hover { color: var(--u-text); background: var(--u-raised); }
.drawer-b { padding: 22px 24px; overflow-y: auto; flex: 1; }
.drawer-section { margin-bottom: 24px; }
.drawer-section-l { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--u-text-3); margin-bottom: 10px; }
.drawer-bar-track { height: 9px; background: var(--u-sunken); border-radius: 5px; overflow: hidden; }
.drawer-bar-fill { height: 100%; background: var(--u-accent); border-radius: 5px; }
.drawer-bar-note { font-size: 11px; color: var(--u-text-2); margin-top: 7px; }
.drawer-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.drawer-kpi { border: 1px solid var(--u-border); border-radius: 9px; padding: 12px; background: var(--u-raised); }
.drawer-kpi-v { font-size: 19px; font-weight: 800; color: var(--u-text); font-family: var(--u-font-num); }
.drawer-kpi-l { font-size: 9px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--u-text-3); margin-top: 4px; }

.drawer-exec-row:last-child { border-bottom: 0; }
.drawer-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--u-raised); color: var(--u-text-2); display: flex;
  align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; border: 1px solid var(--u-border-strong); }
.drawer-exec-name { font-size: 12.5px; font-weight: 600; color: var(--u-text); }
.drawer-exec-sub { font-size: 10.5px; color: var(--u-text-3); margin-top: 1px; }
.status-pill { font-size: 9.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; }
.status-pill.interested { background: var(--u-direct-tint); color: var(--u-direct); }
.status-pill.passive { background: var(--u-sunken); color: var(--u-text-2); border: 1px solid var(--u-border-strong); }
.status-pill.verified { background: var(--u-adjacent-tint); color: var(--u-adjacent); }
.status-pill.offlimits { background: var(--u-offlimits-tint); color: var(--u-offlimits); }

.drawer-context-l { font-size: 9.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--u-text-3); margin-bottom: 6px; }

.drawer-link { display: inline-flex; align-items: center; gap: 7px; color: var(--u-signal); font-weight: 600; font-size: 13px; cursor: pointer; margin-top: 4px; }
.drawer-link:hover { text-decoration: underline; }
.drawer-gap { text-align: center; padding: 40px 10px; }

<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useEffect } = React;

/* ─────────────────────────── mock data ───────────────────────────
   Same mandate and figures as the earlier Mapping Progress mockup —
   only the visual system changes here, not the underlying numbers.
   Kickoff Jul 21, original target Sep 1 (6 weeks), data as of Sep 8. */

const KICKOFF = 'Jul 21';
const TARGET_DATE = 'Sep 1';
const TARGET_COMPANIES = 42;
const COMPANIES_CUM = [0, 5, 11, 17, 23, 27, 29, 31];

const CANDIDATES_WEEKLY = [
  { wk: 'W1', date: 'Jul 28', n: 19 },
  { wk: 'W2', date: 'Aug 4', n: 24 },
  { wk: 'W3', date: 'Aug 11', n: 21 },
  { wk: 'W4', date: 'Aug 18', n: 23 },
  { wk: 'W5', date: 'Aug 25', n: 14 },
  { wk: 'W6', date: 'Sep 1', n: 9 },
  { wk: 'W7', date: 'Sep 8', n: 6 },
];

// Daily breakdown of the same 7 weeks above — each week's 7 values sum to that
// week's total exactly (verified separately), so toggling resolution never
// changes the underlying story, only how finely it's shown. GCC weekend
// (Fri–Sat) is near-zero every week by design, which is why daily view uses
// a rolling average rather than flagging individual bars — a flat per-day
// threshold would falsely flag every single weekend.
const CANDIDATES_DAILY_BY_WEEK = [
  [3, 4, 4, 3, 4, 0, 1],
  [4, 5, 5, 4, 5, 0, 1],
  [4, 4, 4, 4, 4, 0, 1],
  [4, 5, 4, 5, 4, 0, 1],
  [3, 3, 2, 3, 2, 0, 1],
  [2, 2, 1, 2, 1, 0, 1],
  [2, 1, 1, 1, 1, 0, 0],
];
const DAILY_START = new Date(2026, 6, 22); // Jul 22, 2026 — first full day after kickoff
function dailySeries() {
  const flat = CANDIDATES_DAILY_BY_WEEK.flat();
  return flat.map((n, i) => {
    const d = new Date(DAILY_START.getTime() + i * 86400000);
    return { i, n, date: d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) };
  });
}
const CANDIDATES_DAILY = dailySeries();

const DAYS_SINCE_LAST_COMPANY = 6;

/* ─────────────────────────── computed, not asserted ───────────────────────────
   Two projection bases, switchable live — this is the point of showing both:
   the full-mandate average quietly hides a recent slowdown by blending it
   with faster early weeks, which is exactly the failure mode this section
   exists to catch. */

function dateFromIndex(idx) {
  const totalDays = Math.round(idx * 7);
  const start = new Date(2026, 6, 21); // Jul 21, 2026
  const d = new Date(start.getTime() + totalDays * 86400000);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function useProjection(basis) {
  return useMemo(() => {
    const last = COMPANIES_CUM.length - 1;
    let pace;
    if (basis === 'recent') {
      const deltas = [];
      for (let i = last - 2; i <= last; i++) deltas.push(COMPANIES_CUM[i] - COMPANIES_CUM[i - 1]);
      pace = deltas.reduce((a, b) => a + b, 0) / deltas.length;
    } else {
      pace = COMPANIES_CUM[last] / last; // full-mandate average
    }
    const targetPace = TARGET_COMPANIES / 6;
    const remaining = TARGET_COMPANIES - COMPANIES_CUM[last];
    const weeksToGo = remaining / pace;
    const projectedIndex = last + weeksToGo;
    const daysLate = Math.round((projectedIndex - 6) * 7);
    return { last, pace, targetPace, remaining, weeksToGo, projectedIndex, daysLate, projectedDate: dateFromIndex(projectedIndex) };
  }, [basis]);
}

function useVelocityStats() {
  return useMemo(() => {
    const vals = CANDIDATES_WEEKLY.map(w => w.n);
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    const avgFirst = vals.slice(0, 4).reduce((a, b) => a + b, 0) / 4;
    const avgRecent = vals.slice(4).reduce((a, b) => a + b, 0) / 3;
    const total = vals.reduce((a, b) => a + b, 0);
    return { avg, avgFirst, avgRecent, total };
  }, []);
}

// Expanding-then-trailing 7-day rolling average — uses whatever history is
// available for the first 6 days, a true trailing 7-day window from day 7 on.
function rollingAverage(series, window) {
  return series.map((d, i) => {
    const lo = Math.max(0, i - window + 1);
    const slice = series.slice(lo, i + 1);
    const avg = slice.reduce((a, b) => a + b.n, 0) / slice.length;
    return avg;
  });
}

const MIN_N_FOR_PERCENTILE = 5; // below this, show the raw points but don't claim a percentile

// Percentile rank of a value within a sorted numeric array — count-below method,
// used so "Nth percentile" is computed, not asserted.
function percentileOf(values, x) {
  const below = values.filter(v => v < x).length;
  return Math.round((below / values.length) * 100);
}
function medianOf(values) {
  const s = values.slice().sort((a, b) => a - b);
  const m = s.length / 2;
  return s.length % 2 === 0 ? (s[m - 1] + s[m]) / 2 : s[Math.floor(m)];
}

function useCompStats(compType, country, nationality) {
  return useMemo(() => {
    const band = COMP_BANDS[compType];
    let filtered = country === 'All countries' ? COMP_POINTS : COMP_POINTS.filter(p => p.country === country);
    filtered = nationality === 'All nationalities' ? filtered : filtered.filter(p => p.nationality === nationality);
    const values = filtered.map(p => p[compType]);
    const reliable = filtered.length >= MIN_N_FOR_PERCENTILE;
    const pct = reliable ? percentileOf(values, band.ourHi) : null;
    const above = filtered.filter(p => p[compType] > band.ourHi).length;
    const declined = filtered.filter(p => p.o === 'declined');
    const declinedAbove = declined.filter(p => p[compType] > band.ourHi).length;
    const median = values.length ? medianOf(values) : 0;
    const dataMin = values.length ? Math.min(...values) : band.ourLo;
    const dataMax = values.length ? Math.max(...values) : band.ourHi;
    const axisLo = Math.floor((Math.min(dataMin, band.ourLo) - 60) / 50) * 50;
    const axisHi = Math.ceil((Math.max(dataMax, band.ourHi) + 60) / 50) * 50;
    return { band, filtered, values, reliable, pct, above, total: filtered.length, declinedTotal: declined.length, declinedAbove, median, axisLo, axisHi };
  }, [compType, country, nationality]);
}

// Fixed comparison, independent of whatever the interactive filters above are set
// to — the largest nationality group in this disclosed set vs. everyone else,
// on total package. Two buckets only (not all 4 nationalities) because most
// individual groups here are too thin (n=1-2) to say anything reliable; the
// largest-vs-rest split is the one comparison both sides clear n≥5 on.
function useNationalityGap() {
  return useMemo(() => {
    const counts = {};
    COMP_POINTS.forEach(p => { counts[p.nationality] = (counts[p.nationality] || 0) + 1; });
    const largestNat = Object.keys(counts).reduce((a, b) => (counts[b] > counts[a] ? b : a));
    const largest = COMP_POINTS.filter(p => p.nationality === largestNat).map(p => p.pkg);
    const rest = COMP_POINTS.filter(p => p.nationality !== largestNat).map(p => p.pkg);
    const reliable = largest.length >= MIN_N_FOR_PERCENTILE && rest.length >= MIN_N_FOR_PERCENTILE;
    const largestMedian = medianOf(largest), restMedian = medianOf(rest);
    const higherSide = restMedian > largestMedian ? 'rest' : 'largest';
    const gapPct = Math.round((Math.abs(restMedian - largestMedian) / Math.min(largestMedian, restMedian)) * 100);
    return { largestNat, largestN: largest.length, restN: rest.length, largestMedian, restMedian, reliable, higherSide, gapPct };
  }, []);
}

function RemunerationChart({ stats, compType, onDrill }) {
  const { band, filtered, median, axisLo, axisHi } = stats;
  const { ourLo, ourHi } = band;
  const W = 760, H = 172, padL = 20, padR = 20, padT = 34, padB = 48;
  const X = v => padL + ((v - axisLo) / (axisHi - axisLo)) * (W - padL - padR);
  const midY = padT + (H - padT - padB) / 2;
  const plotBottom = H - padB;
  const row1Y = plotBottom + 18; // band-edge labels
  const row2Y = plotBottom + 38; // median label — its own row, so it can never collide with row 1

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto', display: 'block', overflow: 'visible' }}>
      <rect x={X(ourLo)} y={padT - 10} width={X(ourHi) - X(ourLo)} height={plotBottom - (padT - 10)} fill="var(--u-accent)" opacity="0.1" />
      <rect x={X(ourLo)} y={padT - 10} width={X(ourHi) - X(ourLo)} height={plotBottom - (padT - 10)} fill="none" stroke="var(--u-accent)" strokeWidth="1" strokeDasharray="4 3" opacity="0.5" />
      <text x={(X(ourLo) + X(ourHi)) / 2} y={padT - 16} textAnchor="middle" fontSize="10" fontWeight="700" letterSpacing=".04em" fill="var(--u-accent)">OUR OFFERED BAND</text>

      {/* band edges, labeled — the two numbers that actually matter, not a generic axis */}
      <line x1={X(ourLo)} y1={plotBottom} x2={X(ourLo)} y2={plotBottom + 6} stroke="var(--u-accent)" strokeWidth="1" strokeDasharray="2 2" opacity="0.7" />
      <text x={X(ourLo)} y={row1Y} textAnchor="middle" fontSize="10" fontWeight="700" fill="var(--u-accent)" fontFamily="JetBrains Mono, monospace">${ourLo.toLocaleString()}K</text>
      <line x1={X(ourHi)} y1={plotBottom} x2={X(ourHi)} y2={plotBottom + 6} stroke="var(--u-accent)" strokeWidth="1" strokeDasharray="2 2" opacity="0.7" />
      <text x={X(ourHi)} y={row1Y} textAnchor="middle" fontSize="10" fontWeight="700" fill="var(--u-accent)" fontFamily="JetBrains Mono, monospace">${ourHi.toLocaleString()}K</text>

      {filtered.length > 0 && (
        <React.Fragment>
          <line x1={X(median)} y1={padT - 4} x2={X(median)} y2={row2Y - 8} stroke="var(--u-offlimits)" strokeWidth="1.4" strokeDasharray="3 3" />
          <circle className="pulse-ring rust" cx={X(median)} cy={padT - 4} r="5" />
          <circle className="pulse-ring rust delay" cx={X(median)} cy={padT - 4} r="5" />
          <circle cx={X(median)} cy={padT - 4} r="5" fill="var(--u-offlimits)" stroke="var(--surface)" strokeWidth="2" />
          <text x={X(median)} y={row2Y} textAnchor="middle" fontSize="9.5" fontWeight="700" letterSpacing=".03em" fill="var(--u-offlimits)">MEDIAN ${Math.round(median).toLocaleString()}K</text>
        </React.Fragment>
      )}

      <line x1={padL} y1={midY} x2={W - padR} y2={midY} stroke="var(--border-2)" strokeWidth="1" />
      {filtered.map((p, i) => (
        <circle key={i} cx={X(p[compType])} cy={midY} r="7" fill={OUTCOME_COLOR[p.o]} stroke="var(--surface)" strokeWidth="2"
          style={{ cursor: 'pointer' }} onClick={() => onDrill({ kind: 'candidate', data: p })}>
          <title>{`${p.name} · $${p[compType].toLocaleString()}K · ${OUTCOME_LABEL[p.o]}`}</title>
        </circle>
      ))}
      <text x={W - padR} y={padT - 16} textAnchor="end" fontSize="9.5" fill="var(--faint)" fontFamily="JetBrains Mono, monospace">{stats.band.unit}</text>
    </svg>
  );
}

function Heatmap({ onCell }) {
  const matrix = LVL.map((_, li) => SECT.map((__, si) => (BUBBLES.find(x => x.l === li && x.s === si) || { n: 0 }).n));
  const max = Math.max(...BUBBLES.map(b => b.n));
  // Quantities of one thing (heat) use the sequential ramp, not the accent color —
  // 5 discrete steps matching the palette's --u-seq-1..5 tokens.
  const seqStep = t => Math.min(4, Math.floor(t * 5));
  const seqColor = idx => `var(--u-seq-${idx + 1})`;
  return (
    <div className="hm">
      <div />
      {SECT.map(s => <div key={s} className="hm-colh mono">{s}</div>)}
      {LVL.map((lv, li) => (
        <React.Fragment key={lv}>
          <div className="hm-rowh">{lv}</div>
          {SECT.map((s, si) => {
            const v = matrix[li][si]; const t = v / max;
            const open = () => onCell({ kind: 'cell', sector: s, level: lv, n: v });
            const idx = seqStep(t);
            return v === 0
              ? <button key={si} className="hm-cell empty" onClick={open}>·</button>
              : <button key={si} className="hm-cell" onClick={open}
                  style={{ background: seqColor(idx), color: idx >= 3 ? 'var(--u-bg)' : '#fff' }}>{v}</button>;
          })}
        </React.Fragment>
      ))}
    </div>
  );
}

function RelevanceMix() {
  const total = RELEVANCE_MIX.reduce((a, s) => a + s.n, 0);
  return (
    <div>
      <div className="stack">
        {RELEVANCE_MIX.map((s, i) => <div key={i} className="stack-seg" style={{ width: (s.n / total) * 100 + '%', background: s.color }} title={`${s.label} · ${s.n}`} />)}
      </div>
      <div className="stack-legend">
        {RELEVANCE_MIX.map((s, i) => (
          <span className="stack-leg" key={i}><span className="stack-leg-dot" style={{ background: s.color }} />{s.label}<b className="mono">{s.n}</b></span>
        ))}
      </div>
    </div>
  );
}

function DrawerKPI({ v, l }) { return <div className="drawer-kpi"><div className="drawer-kpi-v">{v}</div><div className="drawer-kpi-l">{l}</div></div>; }

function CellPanelContent({ item }) {
  const { sector, level, n } = item;
  const key = sector + '|' + level;
  const companies = CELL_COMPANIES[key] || [];
  const execs = CELL_EXECS[key] || [];

  if (n === 0) {
    return (
      <div className="drawer-gap">
        <div className="drawer-gap-ic"><Icon name="SearchX" size={28} /></div>
        <div className="drawer-gap-t">No executives identified in this slice yet.</div>
        <div className="drawer-context" style={{ marginTop: 16, textAlign: 'left' }}>
          <div className="drawer-context-l">Context</div>
          <div className="drawer-context-t">{sector} · {level} is in scope but hasn't produced a candidate. Worth a targeted pass on {sector.toLowerCase()} companies at this level before assuming the market is genuinely empty here.</div>
        </div>
      </div>
    );
  }

  // Estimate remaining market size using the same heuristic as the original prototype.
  const est = Math.round(n * 1.4) + 1;
  const covPct = Math.min(Math.round((n / est) * 100), 100);
  const remaining = Math.max(est - n, 0);
  const seed = sector.length * 3 + level.length;
  const compFit = 45 + (seed % 30), female = 22 + (seed % 22), gccNat = 20 + (seed % 25);
  const interested = execs.filter(e => e.status === 'interested').length || Math.round(n * 0.3);
  const offlimits = execs.filter(e => e.status === 'offlimits').length || (n > 8 ? 1 : 0);
  const passive = Math.max(n - interested - offlimits, 0);

  return (
    <React.Fragment>
      <div className="drawer-section">
        <div className="drawer-section-l">Coverage of this pocket</div>
        <div className="drawer-bar-track"><div className="drawer-bar-fill" style={{ width: covPct + '%' }} /></div>
        <div className="drawer-bar-note">{covPct}% mapped · {n} / ~{est} · ~{remaining} likely still in market</div>
      </div>
      <div className="drawer-section">
        <div className="drawer-kpis">
          <DrawerKPI v={compFit + '%'} l="Comp-fit" />
          <DrawerKPI v={female + '%'} l="Female" />
          <DrawerKPI v={gccNat + '%'} l="GCC nat." />
        </div>
      </div>
      <div className="drawer-section">
        <div className="drawer-section-l">Interest in this slice</div>
        <div className="stack" style={{ height: 22 }}>
          <div className="stack-seg" style={{ width: (interested / n) * 100 + '%', background: 'var(--u-direct)' }} />
          <div className="stack-seg" style={{ width: (passive / n) * 100 + '%', background: 'var(--border-2)' }} />
          <div className="stack-seg" style={{ width: (offlimits / n) * 100 + '%', background: 'var(--u-offlimits)' }} />
        </div>
        <div className="stack-legend">
          <span className="stack-leg"><span className="stack-leg-dot" style={{ background: 'var(--u-direct)' }} />Interested<b className="mono">{interested}</b></span>
          <span className="stack-leg"><span className="stack-leg-dot" style={{ background: 'var(--border-2)' }} />Passive<b className="mono">{passive}</b></span>
          <span className="stack-leg"><span className="stack-leg-dot" style={{ background: 'var(--u-offlimits)' }} />Off-limits<b className="mono">{offlimits}</b></span>
        </div>
      </div>
      {execs.length > 0 && (
        <div className="drawer-section">
          <div className="drawer-section-l">Executives in this slice</div>
          {execs.map((e, i) => (
            <div className="drawer-exec-row" key={i}>
              <span className="drawer-avatar">{initials(e.name)}</span>
              <span style={{ flex: 1, minWidth: 0 }}>
                <span className="drawer-exec-name">{e.name}</span>
                <div className="drawer-exec-sub">{e.co} · {level}</div>
              </span>
              <span className={'status-pill ' + e.status}>{STATUS_LABEL[e.status]}</span>
            </div>
          ))}
        </div>
      )}
      {companies.length > 0 && (
        <div className="drawer-section">
          <div className="drawer-section-l">Companies contributing</div>
          {companies.map(c => (
            <div className="drawer-exec-row" key={c}><span style={{ fontSize: 12.5, fontWeight: 600 }}>{c}</span></div>
          ))}
        </div>
      )}
      <div className="drawer-context">
        <div className="drawer-context-l">Context</div>
        <div className="drawer-context-t">{sector} {level} is {n >= 10 ? 'a core, well-covered pocket' : 'a thinner pocket than the FMCG core'}. Comp-competitive for {compFit}% of those mapped.</div>
      </div>
      <div className="drawer-link"><Icon name="ArrowRight" size={13} />Open these {n} executives in the table</div>
    </React.Fragment>
  );
}

/* ─────────────────────────── Diversity & DEI — data ───────────────────────────
   Same mandate, same 116-candidate universe already established (Board 5 /
   C-Suite 51 / N-1 38 / N-2 22, matching Shape of the Market exactly). Gender
   is aggregate-only by design — no individual is named or identifiable here.
   Nationality is shown at full breakdown since it's a genuine GCC compliance
   question (Nitaqat/Emiratisation-style requirements), not a sensitive one. */

const LEVELS_DEI = ['Board', 'C-Suite', 'N-1', 'N-2'];
const GENDER_BY_LEVEL = { Board: 1, 'C-Suite': 14, 'N-1': 13, 'N-2': 9 }; // female count per level
const NAT_LEVEL_MATRIX = {
  Saudi: { Board: 2, 'C-Suite': 14, 'N-1': 9, 'N-2': 5 },
  Emirati: { Board: 1, 'C-Suite': 9, 'N-1': 6, 'N-2': 3 },
  Egyptian: { Board: 1, 'C-Suite': 8, 'N-1': 6, 'N-2': 4 },
  Lebanese: { Board: 1, 'C-Suite': 7, 'N-1': 5, 'N-2': 3 },
  Indian: { Board: 0, 'C-Suite': 6, 'N-1': 5, 'N-2': 3 },
  British: { Board: 0, 'C-Suite': 4, 'N-1': 3, 'N-2': 2 },
  Other: { Board: 0, 'C-Suite': 3, 'N-1': 4, 'N-2': 2 },
};
const NATIONALITIES = Object.keys(NAT_LEVEL_MATRIX);
const GCC_NATIONALITIES = ['Saudi', 'Emirati'];
const NAT_FILTER_OPTIONS = ['GCC nationals', 'All nationalities', ...NATIONALITIES];
const LEVEL_FILTER_OPTIONS = ['All levels', ...LEVELS_DEI];

function useDEIStats(natFilter, levelFilter) {
  return useMemo(() => {
    const levelTotals = {};
    LEVELS_DEI.forEach(l => { levelTotals[l] = NATIONALITIES.reduce((a, n) => a + NAT_LEVEL_MATRIX[n][l], 0); });
    const universeTotal = Object.values(levelTotals).reduce((a, b) => a + b, 0);

    const natTotals = {};
    NATIONALITIES.forEach(n => { natTotals[n] = LEVELS_DEI.reduce((a, l) => a + NAT_LEVEL_MATRIX[n][l], 0); });

    const gccTotal = GCC_NATIONALITIES.reduce((a, n) => a + natTotals[n], 0);
    const femaleTotal = Object.values(GENDER_BY_LEVEL).reduce((a, b) => a + b, 0);

    // Composition facts — what actually answers "what does the mix look like",
    // without presuming any one nationality is the one a client cares about.
    const nationalityCount = NATIONALITIES.filter(n => natTotals[n] > 0).length;
    const largestNat = NATIONALITIES.reduce((a, b) => (natTotals[b] > natTotals[a] ? b : a));
    const largestPct = Math.round((natTotals[largestNat] / universeTotal) * 100);

    // The one gender pattern worth leading with — thins toward the top, the
    // standard finding almost every DEI benchmark reports.
    const femalePctByLevel = LEVELS_DEI.map(l => Math.round((GENDER_BY_LEVEL[l] / levelTotals[l]) * 100));
    const thinLevel = LEVELS_DEI[femalePctByLevel.indexOf(Math.min(...femalePctByLevel))];
    const thinPct = Math.min(...femalePctByLevel);

    // Feasibility checker — resolves the selected nationality + level into a count.
    const natKeys = natFilter === 'All nationalities' ? NATIONALITIES : natFilter === 'GCC nationals' ? GCC_NATIONALITIES : [natFilter];
    const levelKeys = levelFilter === 'All levels' ? LEVELS_DEI : [levelFilter];
    const qualifying = natKeys.reduce((a, n) => a + levelKeys.reduce((b, l) => b + NAT_LEVEL_MATRIX[n][l], 0), 0);
    const denom = levelFilter === 'All levels' ? universeTotal : levelTotals[levelFilter];
    const byLevelForNat = LEVELS_DEI.map(l => natKeys.reduce((a, n) => a + NAT_LEVEL_MATRIX[n][l], 0));

    return {
      levelTotals, universeTotal, natTotals, gccTotal, femaleTotal,
      nationalityCount, largestNat, largestPct, thinLevel, thinPct,
      qualifying, denom, byLevelForNat,
    };
  }, [natFilter, levelFilter]);
}

// Population-pyramid style: bar LENGTH is scaled to actual headcount at that level (not
// just %), which a flat percentage bar hides — Board's 20% female is 1 of only 5 people,
// a very different statistical weight than N-2's 41% of 22, and this makes that visible.
// Animates a number from its previous value to a new one whenever the target changes —
// used so the feasibility checker's numbers visibly count up/down when a filter changes,
// instead of snapping, which is what actually makes the interaction feel like cause-effect.
function useCountUp(target, duration = 500) {
  const [display, setDisplay] = useState(target);
  const prevRef = useRef(target);
  useEffect(() => {
    const from = prevRef.current, to = target;
    if (from === to) { setDisplay(to); return; }
    let startTime = null, raf;
    const step = ts => {
      if (startTime === null) startTime = ts;
      const progress = Math.min((ts - startTime) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setDisplay(from + (to - from) * eased);
      if (progress < 1) raf = requestAnimationFrame(step);
      else prevRef.current = to;
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target, duration]);
  return display;
}


function GenderPyramid({ stats }) {
  const W = 720, rowH = 58, padTop = 22;
  const rows = LEVELS_DEI.map(l => {
    const total = stats.levelTotals[l];
    const female = GENDER_BY_LEVEL[l];
    return { l, total, female, male: total - female, pct: Math.round((female / total) * 100) };
  });
  const H = padTop + rows.length * rowH + 6;
  const centerX = W / 2;
  const halfW = W / 2 - 80;
  const maxVal = Math.max(...rows.flatMap(r => [r.female, r.male]));
  const scale = v => (v / maxVal) * halfW;
  const barH = 22;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto', display: 'block' }}>
      <text x={centerX - 10} y={14} textAnchor="end" fontSize="10" fontWeight="700" letterSpacing=".06em" fill="var(--u-accent)">FEMALE</text>
      <text x={centerX + 10} y={14} textAnchor="start" fontSize="10" fontWeight="700" letterSpacing=".06em" fill="var(--faint)">MALE</text>
      <line x1={centerX} y1={20} x2={centerX} y2={H - 4} stroke="var(--border-2)" strokeWidth="1" strokeDasharray="2 3" />
      {rows.map((r, i) => {
        const rowTop = padTop + i * rowH;
        const barY = rowTop + 16;
        const fw = scale(r.female), mw = scale(r.male);
        return (
          <g key={r.l}>
            <text x={centerX} y={rowTop + 10} textAnchor="middle" fontSize="11" fontWeight="700" fill="var(--ink)">{r.l}</text>
            <rect x={centerX - fw} y={barY} width={fw} height={barH} rx="4" fill="var(--u-accent)" />
            <rect x={centerX} y={barY} width={mw} height={barH} rx="4" fill="var(--border-2)" />
            <text x={centerX - fw - 8} y={barY + barH / 2 + 4} textAnchor="end" fontSize="11" fontWeight="700" fill="var(--u-accent)">{r.female}</text>
            <text x={centerX + mw + 8} y={barY + barH / 2 + 4} textAnchor="start" fontSize="11" fontWeight="700" fill="var(--muted)">{r.male}</text>
            <text x={centerX} y={barY + barH + 14} textAnchor="middle" fontSize="9.5" fontWeight="600" fill="var(--u-accent)">{r.pct}% female</text>
          </g>
        );
      })}
    </svg>
  );
}

const NAT_COLOR = {
  Saudi: 'var(--u-chart-1)', Emirati: 'var(--u-chart-2)', Egyptian: 'var(--u-chart-3)',
  Lebanese: 'var(--u-chart-4)', Indian: 'var(--u-chart-5)', British: 'var(--u-chart-6)', Other: 'var(--faint)',

// Donut, built via the standard stroke-dasharray/dashoffset technique (no path-arc math
// needed). GCC nationalities get the two bold colors; everything else is grayscale, so
// color itself carries the GCC/non-GCC distinction this section exists to answer.
function NationalityDonut({ stats }) {
  const size = 200, r = 66, thickness = 28, cx = size / 2, cy = size / 2;
  const circumference = 2 * Math.PI * r;
  let cumulative = 0;
  const segs = NATIONALITIES.map(n => {
    const val = stats.natTotals[n];
    const dash = (val / stats.universeTotal) * circumference;
    const seg = { n, val, dash, offset: -cumulative };
    cumulative += dash;
    return seg;
  });
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 30, flexWrap: 'wrap' }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ flexShrink: 0 }}>
        <g transform={`rotate(-90 ${cx} ${cy})`}>
          {segs.map(s => (
            <circle key={s.n} cx={cx} cy={cy} r={r} fill="none" stroke={NAT_COLOR[s.n]} strokeWidth={thickness}
              strokeDasharray={`${s.dash} ${circumference - s.dash}`} strokeDashoffset={s.offset} />
          ))}
        </g>
        <text x={cx} y={cy - 3} textAnchor="middle" fontSize="25" fontWeight="800" fill="var(--ink)">{stats.largestPct}%</text>
        <text x={cx} y={cy + 16} textAnchor="middle" fontSize="9" fontWeight="700" letterSpacing=".05em" fill="var(--faint)">{stats.largestNat.toUpperCase()}</text>
      </svg>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8, flex: 1, minWidth: 190 }}>
        {NATIONALITIES.map(n => (
          <div key={n} style={{ display: 'flex', alignItems: 'center', gap: 9, fontSize: 12.5 }}>
            <span style={{ width: 11, height: 11, borderRadius: 3, background: NAT_COLOR[n], flexShrink: 0 }} />
            <span style={{ color: 'var(--muted)', flex: 1 }}>{n}</span>
            <span className="mono" style={{ fontWeight: 700 }}>{stats.natTotals[n]}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

      <div className="card" style={{ borderStyle: 'dashed' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <Icon name="Lock" size={15} style={{ color: 'var(--faint)', flexShrink: 0 }} />
          <div style={{ fontSize: 12.5, color: 'var(--muted)' }}>
            <b style={{ color: 'var(--ink)' }}>Cross-mandate diversity benchmark — locked.</b> Needs 5 mandates in this sector × seniority to unlock an aggregate comparison. Currently 2 of 5.
          </div>
        </div>
      </div>
    </React.Fragment>
  );
}

function RemunerationScreen({ onDrill }) {
  const [compType, setCompType] = useState('pkg');
  const [country, setCountry] = useState('All countries');
  const [nationality, setNationality] = useState('All nationalities');
  const stats = useCompStats(compType, country, nationality);
  const gap = useNationalityGap();
  const scopeParts = [];
  if (country !== 'All countries') scopeParts.push(`in ${country}`);
  if (nationality !== 'All nationalities') scopeParts.push(`${nationality} nationals`);
  const scopeLabel = scopeParts.length ? ` (${scopeParts.join(', ')})` : '';

  return (
    <React.Fragment>
      <div className="eyebrow">Screen 3 · Compensation</div>
      <h1 className="h1 serif">Are we underpaying — against real evidence, not an estimate?</h1>
      <div className="lead">Every point below is a <b>named candidate</b> who actually disclosed compensation during engagement. Click one for the full picture.</div>

      <div className="banner">
        <div className="banner-l">At these settings</div>
        {stats.reliable ? (
          <div className="banner-t">
            Our offered ceiling (<b>${stats.band.ourHi.toLocaleString()}K {stats.band.label.toLowerCase()}</b>) sits at only the <b>{stats.pct}th percentile</b> of {stats.total} verified disclosures{scopeLabel} —
            <b> {stats.above} of {stats.total}</b> candidates are priced above our band, and <b>{stats.declinedAbove} of {stats.declinedTotal}</b> declines
            were priced above it too. {compType === 'fixed' ? 'On base salary alone this band looks far more competitive — see Total package for the fuller picture.' : 'This is the clearest lever available to widen the pool.'}
          </div>
        ) : (
          <div className="banner-t">
            Only <b>{stats.total} verified disclosure{stats.total === 1 ? '' : 's'}</b>{scopeLabel} — too few to compute a reliable percentile.
            Points are shown below for reference only; switch back to "All countries" for a statistically meaningful read.
          </div>
        )}
      </div>

      <div className="kpi-row">
        <div className="kpi-card navy">
          <div className="kpi-l">Verified disclosures</div>
          <div className="kpi-v">{stats.total}</div>
          <div className="kpi-sub">{scopeLabel ? scopeLabel.replace(/[()]/g, '') : 'candidates who disclosed comp'}</div>
        </div>
        <div className="kpi-card white">
          <div className="kpi-l">Median verified</div>
          <div className="kpi-v">${Math.round(stats.median).toLocaleString()}<span className="kpi-v-unit">K</span></div>
          <div className="kpi-sub">{stats.band.unit}</div>
        </div>
        <div className="kpi-card rust">
          <div className="kpi-l">Percentile of our ceiling</div>
          <div className="kpi-v">{stats.reliable ? stats.pct : '—'}<span className="kpi-v-unit">{stats.reliable ? 'th' : ''}</span></div>
          <div className="kpi-sub">{stats.reliable ? 'most of the market pays more' : 'n too small to compute'}</div>
        </div>
        <div className="kpi-card rust">
          <div className="kpi-l">Priced above our band</div>
          <div className="kpi-v">{stats.above}<span className="kpi-v-unit">/{stats.total}</span></div>
          <div className="kpi-sub">{stats.total ? Math.round((stats.above / stats.total) * 100) : 0}% of verified disclosures</div>
        </div>
      </div>

      <div className="card">
        <div className="card-h">
          <div>
            <div className="card-t serif">Verified compensation</div>
            <div className="card-fig">n={stats.total} named candidates{scopeLabel} · click a dot for detail</div>
          </div>
          <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
            <div className="toggle-group">
              <button className={'toggle-opt' + (compType === 'pkg' ? ' on' : '')} onClick={() => setCompType('pkg')}>Total package</button>
              <button className={'toggle-opt' + (compType === 'fixed' ? ' on' : '')} onClick={() => setCompType('fixed')}>Total fixed</button>
            </div>
            <select className="country-select" value={country} onChange={e => setCountry(e.target.value)}>
              {COUNTRIES.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
            <select className="country-select" value={nationality} onChange={e => setNationality(e.target.value)}>
              {NATIONALITIES_COMP.map(n => <option key={n} value={n}>{n}</option>)}
            </select>
          </div>
        </div>
        <div style={{ display: 'flex', gap: 16, marginTop: 12, marginBottom: 4, flexWrap: 'wrap' }}>
          <span className="leg-item"><span className="leg-dot" style={{ background: 'var(--u-direct)' }} />Accepted</span>
          <span className="leg-item"><span className="leg-dot" style={{ background: 'var(--u-adjacent)' }} />In process</span>
          <span className="leg-item"><span className="leg-dot" style={{ background: 'var(--u-offlimits)' }} />Declined</span>
          <span className="leg-item"><span className="leg-dot" style={{ background: 'var(--faint)' }} />Withdrawn</span>
          <span className="leg-item"><span className="leg-swatch" style={{ background: 'var(--u-offlimits)', backgroundImage: 'repeating-linear-gradient(90deg, var(--u-offlimits) 0 3px, transparent 3px 5px)' }} />Median</span>
        </div>
        {stats.total > 0 ? <RemunerationChart stats={stats} compType={compType} onDrill={onDrill} /> : (
          <div style={{ padding: '30px 0', textAlign: 'center', color: 'var(--faint)', fontSize: 12.5 }}>No verified disclosures for {country}.</div>
        )}
        <div className="card-note">
          {stats.total > 0
            ? (stats.declinedTotal > 0
                ? <span>{stats.declinedAbove} of {stats.declinedTotal} declines were priced above our top-of-band{scopeLabel} — the offered range is likely capping otherwise-strong candidates.</span>
                : <span>No declines in this slice{scopeLabel} yet — too few data points to read into.</span>)
            : <span>Try "All countries" and "All nationalities" for a larger sample.</span>}
        </div>
      </div>

      <div className="card">
        <div className="card-h">
          <div>
            <div className="card-t serif">Pay by nationality</div>
            <div className="card-fig">total package, all 16 disclosures — a fixed comparison, independent of the filters above</div>
          </div>
        </div>
        {gap.reliable ? (
          <React.Fragment>
            <div className="kpi-row" style={{ gridTemplateColumns: '1fr 1fr' }}>
              <div className="kpi-card navy">
                <div className="kpi-l">{gap.largestNat} nationals, median</div>
                <div className="kpi-v">${Math.round(gap.largestMedian).toLocaleString()}<span className="kpi-v-unit">K</span></div>
                <div className="kpi-sub">n={gap.largestN} disclosures</div>
              </div>
              <div className="kpi-card white">
                <div className="kpi-l">All other nationalities, median</div>
                <div className="kpi-v">${Math.round(gap.restMedian).toLocaleString()}<span className="kpi-v-unit">K</span></div>
                <div className="kpi-sub">n={gap.restN} disclosures</div>
              </div>
            </div>
            <div className="card-note">
              {gap.higherSide === 'rest'
                ? <span>In this pool, <b>non-{gap.largestNat} nationals command a {gap.gapPct}% premium</b> over {gap.largestNat} nationals — the opposite of what's often assumed in this market. Worth confirming whether that holds at scale before pricing a {gap.largestNat}-national requirement.</span>
                : <span><b>{gap.largestNat} nationals command a {gap.gapPct}% premium</b> over all other nationalities in this pool — worth pricing in explicitly if this mandate specifically needs a {gap.largestNat} national.</span>}
              {' '}Based on {gap.largestN + gap.restN} of 16 disclosures — real signal, not a market survey.
            </div>
          </React.Fragment>
        ) : (
          <div className="card-note">Too few disclosures per nationality group to compare reliably — shown for completeness, not as a finding.</div>
        )}
      </div>

      <div className="card" style={{ borderStyle: 'dashed' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <Icon name="Lock" size={15} style={{ color: 'var(--faint)', flexShrink: 0 }} />
          <div style={{ fontSize: 12.5, color: 'var(--muted)' }}>
            <b style={{ color: 'var(--ink)' }}>Cross-mandate compensation benchmark — locked.</b> Needs 5 mandates with verified comp data in this sector × seniority to unlock an aggregate view. Currently 2 of 5.
          </div>
        </div>
      </div>
    </React.Fragment>
  );
}

/* ─────────────────────────── app shell ─────────────────────────── */

const STEP_LIST = [
  { n: 1, l: 'Mapping progress' },
  { n: 2, l: 'Shape of the market' },
  { n: 3, l: 'Remuneration' },
  { n: 4, l: 'Diversity & DEI' },
];
const BUILT_STEPS = [1, 2, 3, 4]; // every listed step is built — grows as new sections are added

function App() {
  const [step, setStep] = useState(3);
  const [drill, setDrill] = useState({ open: false, item: null });
  const openDrill = item => setDrill({ open: true, item });
  const closeDrill = () => setDrill(d => ({ ...d, open: false }));

  return (
    <div className="app">
      <nav className="sidebar">
        <div className="brand"><span className="brand-name">Talent Map</span><span className="brand-dot" /></div>
        <div className="brand-sub">GCC Executive Search</div>
        <span className="mandate-pill">Group CFO — GCC FMCG</span>

        <div className="nav">
          {STEP_LIST.map(s => {
            const built = BUILT_STEPS.includes(s.n);
            const state = s.n === step ? 'active' : built ? 'done' : 'todo';
            return (
              <div className={'nav-item ' + state + (built ? ' clickable' : '')} key={s.l} onClick={() => built && setStep(s.n)}>
                <span className="nav-badge">{s.n}</span>
                <span className="nav-label">{s.l}</span>
              </div>
            );
          })}
        </div>

        <div className="sidebar-foot">Talent mapping report. Synced from live search data. v1 · Draft for internal review.</div>
      </nav>

      <div className="main">
        <div className="content">
          {step === 1 && <MappingProgressScreen />}
          {step === 2 && <ShapeOfMarketScreen onDrill={openDrill} />}
          {step === 3 && <RemunerationScreen onDrill={openDrill} />}
          {step === 4 && <DEIScreen />}
        </div>
      </div>

      <Drawer open={drill.open} item={drill.item} onClose={closeDrill} />
    </div>
  );
}

lucide.createIcons();
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
