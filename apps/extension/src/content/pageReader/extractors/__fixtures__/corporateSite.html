<!--
  An ordinary corporate site: JSON-LD in a @graph, OpenGraph beside it, and nothing else structured.
  The common case for the GCC long tail, and the one the universal extractor exists for.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta property="og:site_name" content="Al Rawabi" />
    <meta property="og:url" content="https://alrawabidairy.ae/" />
    <meta property="og:description" content="Fresh dairy from the UAE since 1989." />
    <link rel="canonical" href="https://alrawabidairy.ae/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          { "@type": "WebSite", "name": "Al Rawabi", "url": "https://alrawabidairy.ae" },
          {
            "@type": "Organization",
            "legalName": "Al Rawabi Dairy Company LLC",
            "name": "Al Rawabi",
            "url": "https://alrawabidairy.ae",
            "description": "Fresh dairy from the UAE since 1989.",
            "sameAs": [
              "https://www.facebook.com/alrawabi",
              "https://www.linkedin.com/company/al-rawabi-dairy/"
            ],
            "numberOfEmployees": { "@type": "QuantitativeValue", "minValue": 1200 },
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Dubai",
              "addressCountry": { "@type": "Country", "name": "United Arab Emirates" }
            }
          }
        ]
      }
    </script>
  </head>
  <body><h1>Al Rawabi</h1></body>
</html>
