<!--
  A company directory page, in the three shapes these pages render facts in — a definition list, a
  table, and a label/value div pair. The directory extractor reads labels rather than layout, so this
  fixture is about the labels surviving, not about any one site's markup.

  It also carries the trap the extractor's length guard exists for: a paragraph that begins with the
  word "Industry" but is prose, not a fact row.
-->
<!doctype html>
<html lang="en">
  <head><title>Zenith Industrial — Company Profile</title></head>
  <body>
    <main>
      <h1>Zenith Industrial</h1>

      <dl>
        <dt>Website</dt>
        <dd>zenith-industrial.sa</dd>
        <dt>Industry</dt>
        <dd>Industrial Machinery</dd>
      </dl>

      <table>
        <tr><th>Employees</th><td>2,400</td></tr>
        <tr><th>Headquarters</th><td>Riyadh, Riyadh Province, Saudi Arabia</td></tr>
      </table>

      <div>
        <span>Description</span>
        <span>Heavy machinery for the GCC construction sector.</span>
      </div>

      <p>Industry analysts have covered this company since 1998 in a range of publications.</p>

      <a href="https://www.linkedin.com/company/zenith-industrial/">LinkedIn</a>
    </main>
  </body>
</html>
