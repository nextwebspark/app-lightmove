<!doctype html><html><body>
<div role="toolbar" aria-label="Meeting controls">
  <button type="button" id="chat-button" data-tid="chat-button" aria-label="Chat"></button>
  <button type="button" id="roster-button" data-tid="roster-button" aria-label="People">3</button>
  <button type="button" id="callingButtons-showMoreBtn" data-tid="callingButtons-showMoreMenu" aria-label="More"></button>
  <button type="button" id="microphone-button" aria-label="Unmute mic"></button>
  <button type="button" id="video-button" aria-label="Turn camera on"></button>
  <button type="button" id="hangup-button" data-tid="hangup-main-btn" aria-label="Leave"></button>
</div>
<div data-tid="closed-caption-renderer-wrapper">
  <div class="caption-item"><span data-tid="author">Priya Raman</span><div><span data-tid="closed-caption-text">I led the finance transformation in Riyadh.</span></div></div>
  <div class="caption-item"><span data-tid="author">Yara Haddad</span><div><span data-tid="closed-caption-text">What drew you to the group role?</span></div></div>
</div>
<div data-tid="message-pane-list-runway">
  <div data-tid="chat-pane-message"><span>Uncava Notetaker</span><div data-tid="message-body">Uncava Notetaker is recording and transcribing this call to take notes for Uncava. If you'd rather not be recorded, ask the host to remove it.</div></div>
</div>
<div data-tid="ckeditor" contenteditable="true" role="textbox" aria-label="Type a message"></div>
</body></html>
